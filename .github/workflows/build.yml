name: Build

# Publishes a signed image for every commit on master. It deploys nothing —
# shipping to production is a separate, deliberate act (release.yml).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/deenquest-api

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      # Keyless signing binds this exact digest to this workflow's identity via
      # GitHub's OIDC token, recorded in the Rekor transparency log. deploy.sh
      # verifies that binding on the host before running anything, so pushing a
      # malicious image to the registry is not enough to get it deployed.
      - name: Sign the image
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "0"   # report, don't block: the image is already published
          ignore-unfixed: true

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo "Not deployed. To ship it:"
            echo "1. \`git tag -s vX.Y.Z -m 'release'\` && \`git push --tags\`"
            echo "2. Run the **Release** workflow with that tag."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
